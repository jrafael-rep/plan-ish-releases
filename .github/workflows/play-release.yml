# Builds Plan-ish from the private Triptracker repository and sends it to
# Google Play.
#
# It lives in this public repository because GitHub Actions minutes are free
# for public repositories; the source stays private. Nothing built here is kept
# on GitHub: the signed bundle goes straight to Play and the runner is thrown
# away. Secrets are masked in the (public) logs, and none is ever echoed.
#
# Run it from Actions → "Plan-ish → Google Play" → Run workflow. The "check"
# track does everything except sending: a rehearsal that proves the secrets,
# the build and the signature without touching Play.

name: Plan-ish → Google Play

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Triptracker branch, tag or commit to build
        required: true
        default: claude/geres-trip-tracker-app-y1coxy
        type: string
      track:
        description: Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha        # closed testing
          - production
          - check        # ensaio: verifica os segredos, compila e assina, e não envia nada

permissions:
  contents: read

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PLANISH_DISTRIBUTION: play
      EXPO_PUBLIC_GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
      GERES_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      GERES_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      GERES_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      EXPECTED_CERT_SHA256: EE:22:5E:67:80:98:59:B4:66:33:87:D3:E6:3C:1E:EE:86:69:1B:42:E5:01:0A:1F:C0:AE:F7:2B:7F:93:76:6E
    steps:
      - name: Check the secrets are there
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.TRIPTRACKER_READ_TOKEN }}
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          # O ensaio não envia nada, por isso não precisa da conta de serviço da Play.
          needed="SOURCE_TOKEN KEYSTORE EXPO_PUBLIC_GEO_API_KEY GERES_KEYSTORE_PASSWORD GERES_KEY_ALIAS"
          if [ "${{ inputs.track }}" != "check" ]; then needed="$needed SERVICE_ACCOUNT"; fi
          for name in $needed; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing secret for $name"; missing=1; fi
          done
          exit $missing

      # Every run gets the next number, so nobody bumps app.json by hand. The
      # offset keeps it above the versionCodes already uploaded by hand (≤ 44).
      - name: Number this build
        run: echo "PLANISH_VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Check out Triptracker (private)
        uses: actions/checkout@v4
        with:
          repository: jrafael-rep/Triptracker
          ref: ${{ inputs.ref }}
          token: ${{ secrets.TRIPTRACKER_READ_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Sem o pacote "tools" por defeito: a Google retirou-o e o sdkmanager falha.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # The C++ half of the build is the same from release to release: ccache
      # keeps the compiled objects (all four ABIs here, a cache of its own).
      # Kotlin/Java come from Gradle's build cache, in the Gradle home that
      # setup-gradle saves. Both key on content, so a changed source is
      # always compiled again.
      - name: Install ccache
        run: sudo apt-get install -y -qq ccache > /dev/null

      - name: Reuse compiled C++ (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: planish-ccache-release-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            planish-ccache-release-${{ hashFiles('package-lock.json') }}-
            planish-ccache-release-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test -- --runInBand --silent

      - name: Restore and verify the upload key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 --decode > plan-ish-release.keystore
          chmod 600 plan-ish-release.keystore
          actual="$(keytool -list -v -keystore plan-ish-release.keystore \
            -storepass "$GERES_KEYSTORE_PASSWORD" -alias "$GERES_KEY_ALIAS" \
            | sed -n 's/.*SHA256: //p' | head -1 | tr -d ': ')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The keystore is not the Play upload key (CN=Plan-ish)."
            exit 1
          fi
          echo "Upload key verified."

      - name: Generate the Android project
        env:
          GERES_KEYSTORE_FILE: ${{ github.workspace }}/plan-ish-release.keystore
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build the app bundle
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          # React Native builds with precompiled headers; without this ccache
          # skips almost every call ("Could not use precompiled header").
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
          CCACHE_MAXSIZE: 3G
        run: |
          ccache --zero-stats > /dev/null
          ./gradlew bundleRelease -x lint --no-daemon --build-cache
          ccache --show-stats --verbose | sed -n '1,40p'

      - name: Check what was built
        shell: bash
        run: |
          set -euo pipefail
          aab=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" | grep -q "jar verified"
          manifest=android/app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          grep -q 'package="com.jrafa.planish"' "$manifest"
          grep -q "android:versionCode=\"$PLANISH_VERSION_CODE\"" "$manifest"
          if grep -q REQUEST_INSTALL_PACKAGES "$manifest"; then echo "::error::Play build asks to install packages"; exit 1; fi
          echo "versionName $(node -p "require('./app.json').expo.version") · versionCode $PLANISH_VERSION_CODE"

      # Envio próprio, sem ação de terceiros: o bundle e as notas de versão vão
      # na mesma edição, e antes de a confirmar lê-se de volta da Play o que lá
      # ficou. A ação r0adkll aceitava `whatsNewDirectory` e as notas não
      # chegavam, sem aviso nenhum no log. Aqui, se faltarem, o passo falha.
      - name: Send to Google Play
        if: inputs.track != 'check'
        shell: bash
        env:
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          aab=android/app/build/outputs/bundle/release/app-release.aab
          api=https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.jrafa.planish
          upload=https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/com.jrafa.planish

          # As notas: um ficheiro whatsnew-<língua> por língua, até 500 caracteres.
          notes="$(python3 - <<'PY'
          import json, os, re
          d = 'play/whatsnew'
          out = []
          for f in sorted(os.listdir(d)):
              m = re.fullmatch(r'whatsnew-([a-z]{2,3}-[A-Z]{2})', f)
              if not m:
                  continue
              text = open(os.path.join(d, f), encoding='utf-8').read().strip()
              if len(text) > 500:
                  raise SystemExit(f'{f}: {len(text)} caracteres; a Play aceita 500')
              out.append({'language': m.group(1), 'text': text})
          if not out:
              raise SystemExit('Sem notas de versão em play/whatsnew')
          print(json.dumps(out, ensure_ascii=False))
          PY
          )"
          echo "Notas de versão a enviar:"
          python3 -c 'import json,sys
          for n in json.loads(sys.argv[1]):
              lang, text = n["language"], n["text"]
              print(f"--- {lang} ({len(text)} caracteres)")
              print(text)' "$notes"

          # Um token de acesso a partir da conta de serviço (JWT assinado com openssl).
          umask 077
          printf '%s' "$SERVICE_ACCOUNT" > sa.json
          trap 'rm -f sa.json sa.pem' EXIT
          email="$(python3 -c 'import json; print(json.load(open("sa.json"))["client_email"])')"
          python3 -c 'import json; open("sa.pem","w").write(json.load(open("sa.json"))["private_key"])'
          b64url() { openssl base64 -e -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          header="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
          claims="$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/androidpublisher","aud":"https://oauth2.googleapis.com/token","iat":%d,"exp":%d}' "$email" "$now" "$((now + 3000))" | b64url)"
          signature="$(printf '%s.%s' "$header" "$claims" | openssl dgst -sha256 -sign sa.pem | b64url)"
          rm -f sa.pem sa.json
          token="$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
            -d assertion="$header.$claims.$signature" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          echo "::add-mask::$token"
          call() { curl -sS --fail-with-body -H "Authorization: Bearer $token" "$@"; }
          field() { python3 -c "import json,sys; print(json.load(sys.stdin)[\"$1\"])"; }

          edit="$(call -X POST "$api/edits" -H 'Content-Type: application/json' -d '{}' | field id)"
          echo "Edição $edit"

          version="$(call -X POST "$upload/edits/$edit/bundles?uploadType=media" \
            -H 'Content-Type: application/octet-stream' --data-binary @"$aab" | field versionCode)"
          if [ "$version" != "$PLANISH_VERSION_CODE" ]; then
            echo "::error::A Play recebeu o versionCode $version; esperava $PLANISH_VERSION_CODE"
            exit 1
          fi
          echo "Bundle enviado: versionCode $version"

          name="$(node -p "require('./app.json').expo.version") ($version)"
          body="$(python3 - "$TRACK" "$version" "$name" "$notes" <<'PY'
          import json, sys
          track, version, name, notes = sys.argv[1:]
          print(json.dumps({'track': track, 'releases': [{
              'name': name, 'versionCodes': [version], 'status': 'completed',
              'releaseNotes': json.loads(notes)}]}, ensure_ascii=False))
          PY
          )"
          call -X PUT "$api/edits/$edit/tracks/$TRACK" \
            -H 'Content-Type: application/json; charset=utf-8' --data-binary "$body" > /dev/null

          # Lido de volta antes de confirmar: se as notas não estiverem lá, não se envia.
          call "$api/edits/$edit/tracks/$TRACK" | python3 -c '
          import json, sys
          version, expected = sys.argv[1], len(json.loads(sys.argv[2]))
          track = json.load(sys.stdin)
          mine = [r for r in track.get("releases", []) if version in r.get("versionCodes", [])]
          if not mine:
              raise SystemExit(f"A faixa não tem o versionCode {version}")
          got = mine[0].get("releaseNotes", [])
          release = mine[0]
          langs = ", ".join(n["language"] for n in got) or "nenhuma"
          print("Na faixa", track["track"], ":", release.get("name"), "·", release.get("status"), "· notas em", langs)
          if len(got) != expected:
              raise SystemExit(f"A Play tem {len(got)} notas de versão; esperava {expected}")
          ' "$version" "$notes"

          call -X POST "$api/edits/$edit:commit" > /dev/null
          echo "Enviado para a faixa $TRACK: $name, com notas de versão."

      - name: Remove the key from the runner
        if: always()
        run: rm -f plan-ish-release.keystore
